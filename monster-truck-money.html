<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Truck Money</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #7cc8ff; --sky2: #d8f0ff;
    --dirt: #8b5a2b; --dirt2: #6b4220;
    --orange: #ff7a00; --yellow: #ffd23f; --red: #e63946;
    --ink: #1d1d1f; --card: #ffffff; --green: #2bb673;
    --tw: 130px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink);
    background: #2b2d33 repeating-linear-gradient(45deg, #2b2d33 0 20px, #30323a 20px 40px);
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  h1 {
    font-family: 'Bungee', 'Impact', sans-serif; margin: 6px 0; font-size: clamp(24px, 6vw, 42px);
    color: var(--yellow); text-shadow: 3px 3px 0 var(--red), 6px 6px 0 #000;
    letter-spacing: 1px;
  }
  .stats { display: flex; gap: 10px; align-items: center; }
  .pill {
    background: #000; color: var(--yellow); border: 3px solid var(--yellow); border-radius: 999px;
    padding: 6px 14px; font-weight: 900; font-size: 20px;
  }
  .icon-btn { background: #000; border: 3px solid var(--yellow); border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer; }

  /* Track */
  .track {
    position: relative; height: 150px; border-radius: 16px; overflow: hidden; margin: 10px 0 8px;
    background: linear-gradient(var(--sky1), var(--sky2) 70%);
    border: 4px solid #000;
  }
  .track::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
    background: repeating-linear-gradient(90deg, var(--dirt) 0 30px, var(--dirt2) 30px 60px);
    border-top: 4px solid #4a2d12;
  }
  .hill { position: absolute; bottom: 20px; width: 200px; height: 70px; background: #5cb85c; border-radius: 50% 50% 0 0; opacity: .6; }
  .flag {
    position: absolute; right: 8px; top: 12px; width: 44px; height: 30px; z-index: 1;
    background: conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0) 0 0 / 15px 15px;
    border: 2px solid #000;
  }
  .flag::before { content: ''; position: absolute; right: -6px; top: -4px; width: 4px; height: 110px; background: #333; }
  .truck {
    position: absolute; bottom: 22px; left: 0; width: var(--tw); z-index: 3;
    transition: left 1s ease-in-out;
  }
  .truck svg { display: block; width: 100%; }
  .wheel { transform-box: fill-box; transform-origin: center; }
  .truck.driving .wheel { animation: spin .35s linear infinite; }
  .truck.driving { animation: rumble .15s linear infinite; }
  .truck.jump { animation: jump .9s ease-out forwards; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rumble { 50% { transform: translateY(-2px); } }
  @keyframes jump {
    0% { transform: translateY(0) rotate(0); }
    45% { transform: translateY(-60px) rotate(-10deg); }
    75% { transform: translateY(-10px) rotate(3deg); }
    100% { transform: translateY(-14px) rotate(0); }
  }
  .car { position: absolute; right: 12px; bottom: 26px; width: 72px; z-index: 2; transform-origin: bottom; transition: transform .2s ease-in .4s; }
  .car.crushed { transform: scaleY(.35) scaleX(1.1); }
  .car svg { display: block; width: 100%; }
  .stars { display: flex; justify-content: center; gap: 6px; font-size: 28px; margin-bottom: 8px; }
  .stars span { filter: grayscale(1) opacity(.35); transition: filter .3s, transform .3s; }
  .stars span.on { filter: none; transform: scale(1.15); }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .group { display: flex; gap: 6px; background: #000; padding: 5px; border-radius: 14px; flex-wrap: wrap; justify-content: center; }
  .tab {
    border: 0; border-radius: 10px; padding: 9px 12px; font: 800 15px 'Nunito', sans-serif; cursor: pointer;
    background: #3a3c44; color: #fff;
  }
  .tab small { display: block; font-weight: 600; font-size: 11px; opacity: .8; }
  .tab.active { background: var(--orange); color: #000; }

  /* Game card */
  .card {
    background: var(--card); border-radius: 20px; border: 4px solid #000; padding: 18px 16px 22px;
    box-shadow: 0 8px 0 #000; text-align: center;
  }
  h2 { font-family: 'Bungee', sans-serif; font-weight: 400; margin: 0 0 14px; font-size: clamp(20px, 5vw, 28px); }
  .pile, .bank, .tray { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 12px; }
  .pile { min-height: 100px; padding: 10px; background: #f3efe6; border-radius: 14px; margin-bottom: 16px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .2s; }
  .slot .run { font-weight: 900; font-size: 16px; color: var(--green); min-height: 20px; }
  .slot.lit { transform: translateY(-6px) scale(1.08); }
  .pile.learn { gap: 24px; min-height: 140px; align-items: center; }
  .money-btn.nope { opacity: .45; }
  .guide { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 14px; margin-top: 14px; padding: 12px; background: #fff7d6; border-radius: 14px; }
  .guide[hidden] { display: none; }
  .slot.lit .coin, .slot.lit .bill { box-shadow: 0 0 0 4px var(--yellow), 0 0 16px 4px var(--yellow); }

  /* Money */
  .money { display: flex; flex-direction: column; align-items: center; }
  .cap { font-weight: 900; font-size: 13px; color: #444; margin-top: 4px; white-space: nowrap; }
  .cap.hide { visibility: hidden; }
  .coin {
    width: var(--s); height: var(--s); border-radius: 50%; flex: none; overflow: hidden;
    box-shadow: 0 3px 0 rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.15);
  }
  .coin img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
  .bill {
    width: calc(140px * var(--b, 1)); height: calc(64px * var(--b, 1)); position: relative; flex: none; border-radius: 6px;
    background: linear-gradient(135deg, #d6ebc8, #a7cf93); border: 3px solid #4f7f40; color: #1e4718;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
  }
  .bill .c { position: absolute; font-weight: 900; font-size: 16px; }
  .bill .tl { top: 2px; left: 6px; } .bill .br { bottom: 2px; right: 6px; }
  .bill .oval {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: 58px; height: 40px; border-radius: 50%; border: 2px solid #4f7f40; background: #e8f4df;
    display: grid; place-items: center; font-weight: 900; font-size: 20px;
  }
  .bill .nm { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 9px; font-weight: 900; letter-spacing: 1px; }

  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 460px; margin: 0 auto; }
  .choice {
    font: 900 28px 'Nunito', sans-serif; padding: 14px; border-radius: 14px; border: 4px solid #000;
    background: var(--yellow); cursor: pointer; box-shadow: 0 5px 0 #000;
  }
  .choice:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }
  .choice.wrong { background: #ddd; color: #999; animation: shake .4s; }
  .choice.right { background: var(--green); color: #fff; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .btn {
    font: 900 18px 'Nunito', sans-serif; padding: 12px 20px; border-radius: 12px; border: 3px solid #000;
    cursor: pointer; box-shadow: 0 4px 0 #000; background: #fff;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
  .btn.go { background: var(--green); color: #fff; font-size: 22px; padding: 12px 32px; }
  .helper { margin-top: 16px; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  .price-tag {
    display: inline-flex; align-items: center; gap: 12px; background: var(--yellow); border: 4px dashed #000;
    border-radius: 16px; padding: 10px 20px; margin-bottom: 14px; font-weight: 900; font-size: 22px;
  }
  .price-tag .emoji { font-size: 42px; }
  .price-tag .price { font-size: 34px; background: #000; color: var(--yellow); padding: 2px 12px; border-radius: 10px; }
  .label { font-weight: 800; margin: 6px 0 8px; color: #555; }
  .money-btn { background: none; border: 0; padding: 4px; cursor: pointer; border-radius: 12px; }
  .money-btn:active { transform: scale(.92); }
  .money-btn:hover { background: #f3efe6; }
  .tray {
    min-height: 110px; margin-top: 14px; padding: 12px; border: 4px dashed #999; border-radius: 16px; background: #f7f7f7;
    align-items: center;
  }
  .tray .empty { color: #999; font-weight: 800; }
  .tray .cap { display: none; }
  .tray .money-btn { animation: pop .2s; }
  @keyframes pop { from { transform: scale(.4); } }
  .paid { font-weight: 900; font-size: 22px; margin-top: 12px; }
  .paid b { color: var(--green); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); z-index: 20;
    background: #000; color: var(--yellow); border: 3px solid var(--yellow); padding: 12px 22px; border-radius: 14px;
    font-weight: 900; font-size: 20px; transition: transform .3s; text-align: center; max-width: 90vw;
  }
  .toast.show { transform: translate(-50%, 0); }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; z-index: 30; padding: 16px; }
  .modal.hidden { display: none; }
  .modal .card { max-width: 400px; }
  .trophy { font-size: 90px; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(5deg); } }

  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 520px) {
    :root { --tw: 110px; }
    .choice { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Monster Truck Money</h1>
    <div class="stats">
      <div class="pill" title="Trophies">🏆 <span id="trophies">0</span></div>
      <button class="icon-btn" id="mute" title="Sound on/off">🔊</button>
    </div>
  </header>

  <div class="track" id="track">
    <div class="hill" style="left:10%"></div>
    <div class="hill" style="left:55%; width:260px; height:50px"></div>
    <div class="flag"></div>
    <div class="car" id="car">
      <svg viewBox="0 0 70 36">
        <path d="M18 14 L26 4 H46 L54 14 Z" fill="#2a6fdb"/>
        <path d="M28 6 H44 L50 14 H22 Z" fill="#bfe3ff"/>
        <rect x="3" y="13" width="64" height="14" rx="5" fill="#2a6fdb"/>
        <circle cx="16" cy="28" r="7" fill="#222"/><circle cx="16" cy="28" r="3" fill="#aaa"/>
        <circle cx="54" cy="28" r="7" fill="#222"/><circle cx="54" cy="28" r="3" fill="#aaa"/>
      </svg>
    </div>
    <div class="truck" id="truck">
      <svg viewBox="0 0 130 90">
        <!-- suspension -->
        <path d="M34 48 L40 62 M96 48 L90 62" stroke="#555" stroke-width="5"/>
        <!-- body -->
        <path d="M44 26 L54 6 H84 L94 26 Z" fill="#e63946"/>
        <path d="M57 10 H81 L88 25 H50 Z" fill="#bfe3ff"/>
        <rect x="12" y="24" width="106" height="26" rx="7" fill="#e63946"/>
        <rect x="110" y="30" width="10" height="7" rx="2" fill="#ffd23f"/>
        <!-- flames -->
        <path d="M16 44 Q30 30 38 40 Q44 28 52 40 Q58 32 64 44 Z" fill="#ffd23f"/>
        <path d="M18 44 Q30 36 38 42 Q44 34 50 42 Q56 38 60 44 Z" fill="#ff7a00"/>
        <!-- wheels -->
        <g class="wheel">
          <circle cx="34" cy="68" r="20" fill="#1a1a1a"/>
          <circle cx="34" cy="68" r="20" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="5 4"/>
          <circle cx="34" cy="68" r="8" fill="#bbb"/>
          <path d="M34 60 V76 M26 68 H42" stroke="#666" stroke-width="3"/>
        </g>
        <g class="wheel">
          <circle cx="96" cy="68" r="20" fill="#1a1a1a"/>
          <circle cx="96" cy="68" r="20" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="5 4"/>
          <circle cx="96" cy="68" r="8" fill="#bbb"/>
          <path d="M96 60 V76 M88 68 H104" stroke="#666" stroke-width="3"/>
        </g>
      </svg>
    </div>
  </div>
  <div class="stars" id="stars"></div>

  <div class="controls">
    <div class="group" id="modes">
      <button class="tab active" data-mode="learn">🪙 Learn the Coins<small>Names &amp; values</small></button>
      <button class="tab" data-mode="count">💰 Count the Cash<small>How much is it?</small></button>
      <button class="tab" data-mode="pay">🔧 Pay the Garage<small>Pick the right money</small></button>
    </div>
    <div class="group" id="levels">
      <button class="tab active" data-level="1">Level 1<small>1¢ 5¢ 10¢</small></button>
      <button class="tab" data-level="2">Level 2<small>+ 25¢</small></button>
      <button class="tab" data-level="3">Level 3<small>+ $1 and $5</small></button>
    </div>
  </div>

  <main class="card" id="game"></main>
</div>

<div class="toast" id="toast"></div>

<div class="modal hidden" id="win">
  <div class="card">
    <div class="trophy">🏆</div>
    <h2>You crushed it!</h2>
    <p style="font-weight:800;font-size:18px;margin-top:0">You won a trophy!</p>
    <button class="btn go" id="again">Race again!</button>
  </div>
</div>

/* ---------- Sound ---------- */
let actx;
function tone(freq, dur, type = 'sine', when = 0, vol = 0.15) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sGood = () => { tone(523, .15, 'triangle'); tone(659, .15, 'triangle', .12); tone(784, .3, 'triangle', .24); };
const sBad = () => tone(160, .3, 'square', 0, .08);
const sClink = () => { tone(1800, .08, 'triangle', 0, .1); tone(2600, .1, 'triangle', .04, .06); };
const sCount = i => tone(400 + i * 60, .12, 'triangle', 0, .1);
function sVroom() {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 700;
    o.frequency.setValueAtTime(55, t); o.frequency.exponentialRampToValueAtTime(150, t + .5); o.frequency.exponentialRampToValueAtTime(70, t + 1);
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.1);
    o.connect(f).connect(g).connect(actx.destination); o.start(t); o.stop(t + 1.1);
  } catch {}
}

/* ---------- Helpers ---------- */
// cap: show the "Dime · 10¢" caption under it (false = hidden until revealed)
function moneyHTML(k, cap = true, scale = 1) {
  const m = MONEY[k];
  const body = m.bill
    ? `<div class="bill" style="--b:${scale}"><span class="c tl">${m.n}</span><span class="c br">${m.n}</span><span class="oval">$${m.n}</span><span class="nm">${m.name}</span></div>`
    : `<div class="coin" style="--s:${Math.round(m.size * scale)}px"><img src="${COIN_IMG[k]}" alt="" draggable="false"></div>`;
  return `<div class="money">${body}<div class="cap${cap ? '' : ' hide'}">${m.short} · ${m.label}</div></div>`;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
function updateTrack() {
  const truck = $('#truck'), p = state.progress;
  truck.style.left = p >= 5 ? 'calc(100% - var(--tw) - 4px)' : `calc((100% - var(--tw) - 90px) * ${p / 5})`;
  truck.classList.add('driving');
  setTimeout(() => truck.classList.remove('driving'), 1000);
  $('#stars').innerHTML = Array.from({ length: 5 }, (_, i) => `<span class="${i < p ? 'on' : ''}">⭐</span>`).join('');
  $('#trophies').textContent = state.trophies;
}

/* ---------- Learn the Coins ---------- */
function newLearn() {
  const pool = LEVELS[state.level].money;
  const type = pick(['find', 'find', 'name', 'value', 'more']);
  const others = t => shuffle(pool.filter(k => k !== t)).slice(0, 3);
  const pickBtn = (k, scale) => `<button class="money-btn pickable" data-k="${k}">${moneyHTML(k, false, scale)}</button>`;
  let target, html;

  if (type === 'find') {
    target = pick(pool);
    html = `<h2>Tap the ${MONEY[target].short}!</h2>
      <div class="pile learn">${shuffle([target, ...others(target)]).map(k => pickBtn(k, 1.3)).join('')}</div>`;
  } else if (type === 'more') {
    const [a, b] = shuffle(pool.slice()).slice(0, 2);
    const more = Math.random() < 0.6;
    target = (MONEY[a].v > MONEY[b].v) === more ? a : b;
    html = `<h2>Which is worth ${more ? 'MORE' : 'LESS'}?</h2>
      <div class="pile learn">${[a, b].map(k => pickBtn(k, 1.6)).join('')}</div>`;
  } else {
    target = pick(pool);
    html = `<h2>${type === 'name' ? 'What is this called?' : 'How much is this worth?'}</h2>
      <div class="pile learn">${moneyHTML(target, false, 2)}</div>
      <div class="choices">${shuffle([target, ...others(target)]).map(k =>
        `<button class="choice" data-k="${k}">${type === 'name' ? MONEY[k].short : MONEY[k].label}</button>`).join('')}</div>`;
  }

  $('#game').innerHTML = html + `
    <button class="btn helper" id="peek">👀 Show me all the money</button>
    <div class="guide" id="guide" hidden>${pool.map(k => moneyHTML(k)).join('')}</div>`;
  $('#peek').onclick = () => { $('#guide').hidden = !$('#guide').hidden; };

  const reveal = el => el.querySelectorAll('.cap').forEach(c => c.classList.remove('hide'));
  document.querySelectorAll('#game .pickable, #game .choice').forEach(b => b.onclick = () => {
    if (state.busy) return;
    const k = b.dataset.k;
    if (k === target) {
      b.classList.add('right');
      reveal($('#game .pile'));
      correct();
      return;
    }
    sBad(); b.disabled = true;
    if (b.classList.contains('choice')) { b.classList.add('wrong'); toast('Try again!'); return; }
    b.classList.add('nope'); reveal(b);
    if (type === 'find') toast(`That's a ${MONEY[k].short}. Find the ${MONEY[target].short}!`);
    else {
      reveal($('#game .pile'));
      const tip = (k === 'd' || target === 'd') && ['p', 'n'].includes(k === 'd' ? target : k)
        ? ' The dime is small, but it is worth more!' : '';
      toast(`${MONEY[target].short} = ${MONEY[target].label}, ${MONEY[k].short} = ${MONEY[k].label}.${tip}`);
    }
  });
}

/* ---------- Count the Cash ---------- */
function newCount() {
  const cfg = LEVELS[state.level];
  let pile;
  do {
    pile = [];
    for (const k of cfg.money) { const [a, b] = cfg.ranges[k]; for (let i = rand(a, b); i > 0; i--) pile.push(k); }
  } while (pile.length < 2 || pile.length > 12);
  state.pile = pile;
  state.answer = pile.reduce((s, k) => s + MONEY[k].v, 0);

  const opts = new Set([state.answer]);
  while (opts.size < 4) {
    const c = state.answer + pick(cfg.deltas) * pick([-1, 1]);
    if (c > 0) opts.add(c);
  }

  $('#game').innerHTML = `
    <h2>How much money is this?</h2>
    <div class="pile" id="pile">${pile.map(k => `<div class="slot">${moneyHTML(k)}<div class="run"></div></div>`).join('')}</div>
    <div class="choices">${shuffle([...opts]).map(v => `<button class="choice" data-v="${v}">${fmt(v)}</button>`).join('')}</div>
    <button class="btn helper" id="help">🔎 Help me count</button>`;

  document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if (state.busy) return;
    if (+b.dataset.v === state.answer) { b.classList.add('right'); correct(); }
    else {
      b.classList.add('wrong'); b.disabled = true; sBad();
      toast("Not quite! Let's count together.");
      helpCount();
    }
  });
  $('#help').onclick = helpCount;
}

function helpCount() {
  if (state.counting) return;
  state.counting = true;
  const slots = [...document.querySelectorAll('#pile .slot')];
  slots.forEach(s => { s.classList.remove('lit'); s.querySelector('.run').textContent = ''; });
  let run = 0;
  slots.forEach((s, i) => setTimeout(() => {
    run += MONEY[state.pile[i]].v;
    s.classList.add('lit');
    s.querySelector('.run').textContent = fmt(run);
    sCount(i);
    if (i === slots.length - 1) state.counting = false;
  }, i * 800));
}

/* ---------- Pay the Garage ---------- */
function newPay() {
  const cfg = LEVELS[state.level];
  const [emoji, name] = pick(ITEMS);
  state.price = rand(...cfg.pay);
  state.tray = [];
  $('#game').innerHTML = `
    <h2>Buy the ${name}!</h2>
    <div class="price-tag"><span class="emoji">${emoji}</span>${name}<span class="price">${fmt(state.price)}</span></div>
    <div class="label">Tap money to pay:</div>
    <div class="bank">${cfg.money.map(k => `<button class="money-btn" data-k="${k}">${moneyHTML(k)}</button>`).join('')}</div>
    <div class="tray" id="tray"></div>
    <div class="paid">You put in: <b id="paid">0¢</b></div>
    <div class="row">
      <button class="btn" id="clear">↩ Start over</button>
      <button class="btn go" id="pay">Pay!</button>
    </div>`;
  document.querySelectorAll('.bank .money-btn').forEach(b => b.onclick = () => {
    if (state.busy || state.tray.length >= 30) return;
    state.tray.push(b.dataset.k); sClink(); renderTray();
  });
  $('#clear').onclick = () => { if (!state.busy) { state.tray = []; renderTray(); } };
  $('#pay').onclick = checkPay;
  renderTray();
}

function renderTray() {
  const tray = $('#tray');
  // keep tray sorted biggest-first so it's easy to count
  state.tray.sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  tray.innerHTML = state.tray.length
    ? state.tray.map((k, i) => `<button class="money-btn" data-i="${i}" title="Tap to take back">${moneyHTML(k, false)}</button>`).join('')
    : `<span class="empty">Your money goes here</span>`;
  tray.querySelectorAll('.money-btn').forEach(b => b.onclick = () => {
    if (state.busy) return;
    state.tray.splice(+b.dataset.i, 1); renderTray();
  });
  $('#paid').textContent = fmt(state.tray.reduce((s, k) => s + MONEY[k].v, 0));
}

function checkPay() {
  if (state.busy) return;
  const paid = state.tray.reduce((s, k) => s + MONEY[k].v, 0);
  if (paid === state.price) correct();
  else if (paid < state.price) { sBad(); toast(paid === 0 ? 'Tap some money first!' : `Almost! You need ${fmt(state.price - paid)} more.`); }
  else { sBad(); toast(`Too much! Take back ${fmt(paid - state.price)}.`); }
}

/* ---------- Progress & winning ---------- */
function correct() {
  state.busy = true;
  sGood(); sVroom();
  state.progress++;
  updateTrack();
  toast(pick(CHEERS));
  if (state.progress >= 5) setTimeout(win, 1100);
  else setTimeout(() => { state.busy = false; newProblem(); }, 1700);
}

function win() {
  $('#truck').classList.add('jump');
  $('#car').classList.add('crushed');
  setTimeout(() => { tone(90, .4, 'square', 0, .15); }, 450);
  state.trophies++;
  try { localStorage.setItem('mtm-trophies', state.trophies); } catch {}
  $('#trophies').textContent = state.trophies;
  confetti();
  setTimeout(() => { $('#win').classList.remove('hidden'); sGood(); }, 1300);
}

function confetti() {
  const colors = ['#ffd23f', '#e63946', '#2bb673', '#2a6fdb', '#ff7a00'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = pick(colors);
    c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
    c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

$('#again').onclick = () => {
  $('#win').classList.add('hidden');
  $('#truck').classList.remove('jump');
  $('#car').classList.remove('crushed');
  state.progress = 0; state.busy = false;
  updateTrack(); newProblem();
};

function newProblem() {
  state.counting = false;
  ({ learn: newLearn, count: newCount, pay: newPay })[state.mode]();
}

/* ---------- Controls ---------- */
document.querySelectorAll('#modes .tab').forEach(b => b.onclick = () => {
  if (state.busy) return;
  document.querySelectorAll('#modes .tab').forEach(x => x.classList.toggle('active', x === b));
  state.mode = b.dataset.mode; newProblem();
});
document.querySelectorAll('#levels .tab').forEach(b => b.onclick = () => {
  if (state.busy) return;
  document.querySelectorAll('#levels .tab').forEach(x => x.classList.toggle('active', x === b));
  state.level = +b.dataset.level; newProblem();
});
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; };

updateTrack();
newProblem();
</script>
</body>
</html>
